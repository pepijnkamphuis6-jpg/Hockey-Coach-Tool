<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CoachStudio">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080c18">
  <meta name="description" content="Jouw alles-in-één coaching platform voor veld hockey">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <title>Coach Studio</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080c18;
      font-family: -apple-system, 'Inter', BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    #app-frame {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      background: #080c18;
    }

    /* Splash screen — verbergt zich zodra iframe geladen is */
    #splash {
      position: fixed;
      inset: 0;
      background: #080c18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      transition: opacity 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: white;
      letter-spacing: -0.04em;
      box-shadow: 0 16px 48px rgba(59,130,246,0.5);
      animation: pulse-logo 2s ease-in-out infinite;
    }

    .splash-title {
      color: #f1f5f9;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .splash-sub {
      color: #64748b;
      font-size: 14px;
    }

    .splash-loader {
      width: 40px;
      height: 3px;
      background: #1a2540;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .splash-loader-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 3px;
      animation: load 1.8s ease-in-out infinite;
    }

    @keyframes load {
      0% { width: 0%; margin-left: 0; }
      50% { width: 70%; margin-left: 0; }
      100% { width: 0%; margin-left: 100%; }
    }

    @keyframes pulse-logo {
      0%, 100% { box-shadow: 0 16px 48px rgba(59,130,246,0.5); }
      50% { box-shadow: 0 16px 64px rgba(59,130,246,0.75); }
    }

    /* iOS safe area padding */
    @supports (padding-top: env(safe-area-inset-top)) {
      #app-frame {
        top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }

    /* Install banner — verschijnt automatisch als PWA niet geïnstalleerd is */
    #install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #0f1624, #141d2f);
      border: 1px solid #1e2d47;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 340px;
      width: calc(100% - 40px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      z-index: 200;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #install-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    .banner-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      color: white;
      flex-shrink: 0;
    }

    .banner-text { flex: 1; }

    .banner-title {
      color: #f1f5f9;
      font-size: 14px;
      font-weight: 700;
    }

    .banner-sub {
      color: #64748b;
      font-size: 12px;
      margin-top: 2px;
    }

    .banner-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .banner-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      margin-left: -4px;
    }
  </style>
</head>
<body>

  <!-- Splash screen -->
  <div id="splash">
    <div class="splash-logo">CS</div>
    <div class="splash-title">Coach Studio</div>
    <div class="splash-sub">Jouw coaching platform</div>
    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>
  </div>

  <!-- De Streamlit app als fullscreen iframe -->
  <iframe
    id="app-frame"
    src="https://hockey-coach-tool-kazbc9o6ztzrcpnvoxvtup.streamlit.app/?embed=true"
    allow="camera; microphone; fullscreen"
    loading="eager"
    title="Coach Studio"
  ></iframe>

  <!-- Install banner (Android Chrome) -->
  <div id="install-banner">
    <div class="banner-icon">CS</div>
    <div class="banner-text">
      <div class="banner-title">Coach Studio installeren</div>
      <div class="banner-sub">Voeg toe aan je beginscherm</div>
    </div>
    <button class="banner-btn" id="install-btn">Installeer</button>
    <button class="banner-close" id="banner-close">×</button>
  </div>

  <script>
    // Verberg splash als iframe geladen is
    const iframe = document.getElementById('app-frame');
    const splash = document.getElementById('splash');

    iframe.addEventListener('load', () => {
      setTimeout(() => splash.classList.add('hidden'), 600);
    });

    // Fallback: verberg splash na 8 seconden
    setTimeout(() => splash.classList.add('hidden'), 8000);

    // PWA install prompt (Android Chrome)
    let deferredPrompt;
    const banner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const closeBtn = document.getElementById('banner-close');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;

      // Toon banner pas als app al 3 seconden open is
      setTimeout(() => {
        if (!window.matchMedia('(display-mode: standalone)').matches) {
          banner.classList.add('show');
        }
      }, 3000);
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.classList.remove('show');
    });

    closeBtn.addEventListener('click', () => {
      banner.classList.remove('show');
      // Niet meer tonen in deze sessie
      sessionStorage.setItem('banner-dismissed', '1');
    });

    // Service worker registreren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
